name: Release CLI

on:
  # Releases are cut with `pnpm release` (see CLAUDE.md), which bumps every
  # package and pushes the tag that triggers this workflow.
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: claude-remote-control
        run: pnpm install

      - name: Build CLI
        working-directory: claude-remote-control
        run: pnpm --filter 247-cli build

      - name: Bundle CLI (copy hooks and agent)
        working-directory: claude-remote-control/packages/cli
        run: pnpm bundle

      # Extract the version from the tag. Only a plain semver may reach npm:
      # the tag name is otherwise attacker-influenced text used in shell steps.
      - name: Get version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$GITHUB_REF' is not a vMAJOR.MINOR.PATCH release tag" >&2
            exit 1
          fi
          echo "NEW_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Update package.json version
        working-directory: claude-remote-control/packages/cli
        run: |
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version

      - name: Verify version before publish
        working-directory: claude-remote-control/packages/cli
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "Package version: $PACKAGE_VERSION"
          echo "Expected version: $NEW_VERSION"
          test "$PACKAGE_VERSION" = "$NEW_VERSION"

      - name: Publish to npm
        working-directory: claude-remote-control/packages/cli
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: v${{ env.NEW_VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
